name: SSS WhatsApp Algorithmic Bot

on:
  schedule:
    # Runs at minute 0 past every hour. 1H timeframe secured! 🕯️📊
    - cron: '0 * * * *'
  workflow_dispatch: 
    # Manual override in case you need to execute a market order!

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread pandas pytz requests

      - name: Run the Bot Script 🚀
        env:
          # Securing the bag with encrypted secrets 🔐
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
        run: python WA_notify.py
