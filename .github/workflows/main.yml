name: SSS WhatsApp Notification Service

on:
  schedule:
    # 🧠 SCHEDULING LOGIC: 
    # Kisumu is EAT (UTC+3). 
    # To optimize compute usage during inactive hours,
    # the workflow operates between 6 AM and 10 PM EAT.
    # 6 AM EAT = 3 AM UTC. 10 PM EAT = 7 PM UTC.
    - cron: '0 3-19 * * *'
  workflow_dispatch: 
    # Manual override for emergency system updates.

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread pandas pytz requests

      - name: Run the Notification Service 🚀
        env:
          # Secure credentials management 🔐
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
        run: python WA_notify.py