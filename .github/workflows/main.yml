name: SSS WhatsApp Algorithmic Bot

on:
  schedule:
    # Runs every 15 minutes. Pure high-frequency sweeps! 🧹
    - cron: '*/15 * * * *'
  workflow_dispatch: 
    # This line lets you trigger it manually from GitHub just in case!

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread pandas pytz requests

      - name: Run the Bot Script 🚀
        env:
          # You MUST add this secret in your GitHub Repo Settings -> Secrets
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # WA_TOKEN: ${{ secrets.WA_TOKEN }}
          # WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
        run: python bot.py
